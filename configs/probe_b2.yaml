# Batch-2 feasibility probe: does it fit, and what does a step cost?
data:
  da3_depth_root: ~/data/tapvid3d_da3nested
  image_size: 896
  num_tracks: 256
  oversample:
    pstudio: 20
  split:
    source: minival
    n_train: 4
    seed: 42
  subsets:
  - pstudio
  - drivetrack
  - adt
flow:
  cfg: third_party/SEA-RAFT/config/eval/spring-M.json
  fb_alpha: 0.05
  fb_beta: 1.0
  iters: 4
  scale: -1
  source: waft_live
  url: MemorySlices/Tartan-C-T-TSKH-spring540x960-M
loss:
  lambda_dsr: 0.0
  weights:
    pos_3D: 1.0
    reg_uv: 0.1
model:
  d_proj: 64
  dim: 128
  dino_image_size: 448
  dino_model: facebook/dinov3-vits16-pretrain-lvd1689m
  grid: 64
  image_size: 896
  log_ref: 2.0
  log_std: 1.5
  max_delta_uv: 2.0
  max_log_correction: 2.0
  max_scale_correction: 2.5
  num_heads: 4
  num_layers: 2
  patch_size: 5
  state_dim: 64
  two_pool: true
  freeze_scale: true
train:
  amp: bf16
  batch: 2
  ckpt_every: 1000000
  decay: 1
  early_stop_min_delta: 0.001
  early_stop_patience: 1000000
  grad_clip: 1.0
  init_ckpt: result/v91/ckpt_1200.pt
  log_every: 10
  lr: 5.0e-05
  num_workers: 0
  out_dir: result/probe_b2
  seed: 0
  steps: 30
  val_at_step0: false
  val_clips: 40
  val_every: 1000000
  warmup: 0
  weight_decay: 0.05
  window: 8
version: v73
