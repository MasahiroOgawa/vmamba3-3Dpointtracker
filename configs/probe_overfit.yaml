# Can this model reduce its loss at all? Train on ONE clip and watch.
#
# v91's logged loss looked flat, but with batch=1 each logged value was a single clip and the
# per-clip spread is 21x, so the curve could not have shown a trend either way. The logger now
# reports the mean over its window; this run asks the prior question -- whether the optimiser can
# drive the loss down when there is nothing to generalise to.
#
#   loss falls clearly  -> the machinery works; v91's flatness is the task or the step size,
#                          and a learning-rate change is the right fix.
#   loss stays flat     -> something is broken upstream of the learning rate (gradients not
#                          reaching the weights, the loss not depending on them), and changing
#                          the rate would waste the night.
#
# Cost: 150 steps, about 30 min.
data:
  # Pinned to the pre-2026-09-10 sampler, which kept only the queries anchored inside the
  # window (~8 tracks per item). This run's published number was produced that way.
  reanchor_window: false
  da3_depth_root: ~/data/tapvid3d_da3nested
  image_size: 896
  num_tracks: 256
  oversample:
    pstudio: 20
  split:
    source: minival
    n_train: 1
    seed: 42
  subsets:
  - pstudio
  - drivetrack
  - adt
flow:
  cfg: third_party/SEA-RAFT/config/eval/spring-M.json
  fb_alpha: 0.05
  fb_beta: 1.0
  iters: 4
  scale: -1
  source: waft_live
  url: MemorySlices/Tartan-C-T-TSKH-spring540x960-M
loss:
  lambda_dsr: 0.0
  weights:
    pos_3D: 1.0
    reg_uv: 0.1
model:
  d_proj: 64
  dim: 128
  dino_image_size: 448
  dino_model: facebook/dinov3-vits16-pretrain-lvd1689m
  grid: 64
  image_size: 896
  log_ref: 2.0
  log_std: 1.5
  max_delta_uv: 2.0
  max_log_correction: 2.0
  max_scale_correction: 2.5
  num_heads: 4
  num_layers: 2
  patch_size: 5
  state_dim: 64
  two_pool: true
  freeze_scale: true
train:
  amp: bf16
  batch: 1
  ckpt_every: 1000000
  decay: 1
  early_stop_min_delta: 0.001
  early_stop_patience: 1000000
  grad_clip: 1.0
  init_ckpt: result/v91/ckpt_1200.pt
  log_every: 10
  lr: 5.0e-05
  num_workers: 0
  out_dir: result/probe_overfit
  seed: 0
  steps: 150
  val_at_step0: false
  val_clips: 40
  val_every: 1000000
  warmup: 0
  weight_decay: 0.05
  window: 8
version: v73
