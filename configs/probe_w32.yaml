# Window-32 cost probe: 20 steps, visibility head only.
data:
  da3_depth_root: ~/data/tapvid3d_da3nested
  image_size: 896
  num_tracks: 256
  oversample:
    pstudio: 20
  split:
    holdout_val: true
    n_val_monitor: 40
    seed: 42
    source: official
  subsets:
  - pstudio
  - drivetrack
  - adt
  reanchor_window: true
flow:
  cfg: third_party/SEA-RAFT/config/eval/spring-M.json
  fb_alpha: 0.05
  fb_beta: 1.0
  iters: 4
  scale: -1
  source: waft_live
  url: MemorySlices/Tartan-C-T-TSKH-spring540x960-M
loss:
  lambda_dsr: 0.0
  weights:
    pos_3D: 1.0
    reg_uv: 0.1
  lambda_vis: 1.0
model:
  d_proj: 64
  dim: 128
  dino_image_size: 448
  dino_model: facebook/dinov3-vits16-pretrain-lvd1689m
  grid: 64
  image_size: 896
  log_ref: 2.0
  log_std: 1.5
  max_delta_uv: 2.0
  max_log_correction: 2.0
  max_scale_correction: 2.5
  num_heads: 4
  num_layers: 2
  patch_size: 5
  state_dim: 64
  two_pool: true
  freeze_modules:
  - scale_refiner
  - v35
  train_only:
  - vis_head
train:
  amp: bf16
  batch: 1
  ckpt_every: 1000000
  decay: 80
  early_stop_min_delta: 0.001
  early_stop_patience: 1000000
  grad_clip: 1.0
  init_ckpt: result/v73fix_warmstart/ckpt_0.pt
  log_every: 5
  lr: 0.001
  num_workers: 0
  out_dir: result/probe_w32
  seed: 0
  steps: 20
  val_at_step0: false
  val_clips: 40
  val_every: 1000000
  warmup: 0
  weight_decay: 0.05
  window: 32
version: v73
