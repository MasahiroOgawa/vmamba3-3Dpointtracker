version: scale_est_v2

# v2 — switch the output parameterisation from softplus to exp(z).
#
# v1 used `s = softplus(z) + 1e-3` which is the v18/v19 gradient-decay trap:
# ∂s/∂z = sigmoid(z) → 0 as s drifts toward 0 or as z grows large, so
# once predictions drift far from GT the gradient on the head cannot pull
# them back. v1 confirmed this — val MAE went UP (7.06 → 11.40 m) between
# step 500 and 1000.
#
# v2 uses `s = exp(z)`, the same parameterisation that fixed the joint
# tracker's ScaleHead in v20 (see src/mamba3_tracker/model/heads.py).
# ∂s/∂z = s is nonzero everywhere; the model can always recover.
# Final Linear's bias is zero-init so s_init = exp(0) = 1 m at the start.
#
# Everything else identical to v1.

model:
  dim: 384
  num_heads: 6
  state_dim: 64
  head_hidden: 384
  dinov2_model: facebook/dinov3-vits16-pretrain-lvd1689m
  dinov2_image_size: 896
  param: exp                          # ← v2 switch

data:
  subsets: [pstudio, drivetrack, adt]
  image_size: 896
  num_tracks: 256

train:
  steps: 5000
  warmup: 250
  decay: 500
  ckpt_every: 1000
  val_every: 500
  log_every: 50
  lr: 2.0e-4
  weight_decay: 0.05
  grad_clip: 1.0
  batch: 1
  window: 8
  amp: bf16
  num_workers: 1
  seed: 0
