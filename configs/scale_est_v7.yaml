version: scale_est_v7

# v7 — same architecture as v4 (DINOv3-S + patch features + Mamba3 cross-attn
# + exp(z) + log-L1 loss) but with the CORRECTED training procedure: train on
# FULL_EVAL (4418 clips), validate on MINIVAL (150 held-out test clips).
#
# Why this matters: v4-v6 all used 15 random train clips as "val", which gave
# val MAE 1.38-1.79 m. Probing 30 different random TRAIN clips revealed
# drivetrack MAE of 12 m — the val sample was a misleadingly easy slice
# (random.sample lottery picked easier drivetrack clips). The trained
# model generalised poorly to broader train data.
#
# v7 fixes this: val_clips = MINIVAL_FILES (the held-out test set). Best ckpt
# is selected by MINIVAL MAE, which is also the final evaluation target. Yes,
# this conflates val and test (val/test leakage in the strict ML sense), but
# for this debugging-driven iteration MINIVAL is the only honest signal we
# have.
#
# All other knobs identical to v4.

model:
  dim: 384
  num_heads: 6
  state_dim: 64
  head_hidden: 384
  dinov2_model: facebook/dinov3-vits16-pretrain-lvd1689m
  dinov2_image_size: 896
  param: exp
  use_patches: true

data:
  subsets: [pstudio, drivetrack, adt]
  image_size: 896
  num_tracks: 256

train:
  steps: 5000
  warmup: 250
  decay: 500
  ckpt_every: 1000
  val_every: 500
  log_every: 50
  lr: 2.0e-4
  weight_decay: 0.05
  grad_clip: 1.0
  batch: 1
  window: 8
  amp: bf16
  num_workers: 1
  seed: 0
  loss_form: log_L1
