version: v10

# v10 — same loss spec as v9a (vel + pos + smooth, pos weight = vel weight)
# + architectural fix in src/mamba3_tracker/model/propagator.py:
#   `Q ← LayerNorm(Q + delta_ssd + delta_corr)` after every residual update.
#
# Why: v7/v8/v9 all collapsed to static tracks because `Q` (track memory)
# accumulated unbounded across 192 additive updates per clip, blowing up
# to magnitude 10^5–10^6. The head's input LayerNorm rescaled the
# magnitude but the *direction* of Q was dominated by the accumulator,
# so cos(Q(t), Q(0)) ≈ 1 across the whole window — head saw the same
# direction every frame → output the same Δp̂ every frame → tracks
# didn't move regardless of loss recipe. Post-update LayerNorm bounds
# ‖Q‖ so each new residual has visible influence on direction, and the
# pos/vel losses can finally do their job.

model:
  dim: 384
  num_heads: 6
  state_dim: 64
  level_sizes: [32, 64]

data:
  subsets: [pstudio, drivetrack, adt]
  image_size: 448
  num_tracks: 256

train:
  steps: 30000
  warmup: 1000
  decay: 3000
  ckpt_every: 1000
  val_every: 500
  log_every: 50
  lr: 2.0e-4
  weight_decay: 0.05
  grad_clip: 1.0
  batch: 2
  window: 8
  amp: fp32
  num_workers: 1
  seed: 0

loss:
  delta_3d_m: 0.05
  delta_2d_px: 1.0
  weights:
    vel_3D:    1.0
    vel_2D:    1.0
    pos_3D:    1.0      # same as v9a (pos on par with vel)
    pos_2D:    1.0
    smooth_3D: 0.1
    smooth_2D: 0.1
    vis:       1.0
