version: v35

# v41 — v35 vmamba3 refiner retrained on DA3-Nested-Giant metric depth.
#
# Identical architecture and loss to v35 (version stays "v35" so the training
# dispatch builds Mamba3V35Refiner). The ONLY change is the depth source:
# da3_depth_root points at the DA3-Nested-Giant cache (~1.0x metric) instead of
# the da3metric-large cache (~0.55x biased on drivetrack far-field). The v35
# refiner learned to *scale up* the biased depth; retraining on metric depth
# unlearns that over-correction. Warm-started from the v35 checkpoint via
# --init-ckpt. Evaluated with the WAFT front-end (the v41 analog of v39).

model:
  dim: 128
  state_dim: 64
  num_heads: 4
  num_layers: 2
  max_log_correction: 2.0    # depth: [e^-2, e^2] ≈ [0.13x, 7.4x]
  max_delta_uv: 2.0          # 2D correction bounded to ±2 px
  patch_size: 5              # 5×5 depth patch
  d_proj: 64                 # DINOv3 384-dim projected to 64
  dino_model: facebook/dinov3-vits16-pretrain-lvd1689m
  dino_image_size: 448
  image_size: 896

flow:
  url: MemorySlices/Tartan-C-T-TSKH-spring540x960-M
  cfg: third_party/SEA-RAFT/config/eval/spring-M.json
  iters: 4
  scale: null
  fb_alpha: 0.05
  fb_beta: 1.0

data:
  subsets: [pstudio]
  image_size: 896
  num_tracks: 256
  da3_depth_root: ~/data/tapvid3d_da3nested
  split:
    source: official
    n_val_monitor: 15
    seed: 42

train:
  steps: 6000
  warmup: 200
  decay: 1000
  ckpt_every: 500
  val_every: 500
  log_every: 50
  lr: 3.0e-4
  weight_decay: 0.05
  grad_clip: 1.0
  batch: 1
  window: 8
  amp: bf16
  num_workers: 0
  seed: 0

loss:
  weights:
    pos_3D: 1.0
    reg_uv: 0.1    # λ_uv: calibrate so mean|Δuv| ≈ 1px at convergence
