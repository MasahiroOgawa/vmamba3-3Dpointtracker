version: v35

# v43 — v42 refiner + in-model per-frame scale head (sec:v43).
#
# Same architecture/loss/data as v42 (DA3-g depth, pstudio x20 oversample), with ONE
# addition: model.per_frame_scale enables a within-frame masked-mean-pooled head that
# predicts one global log-scale per frame and rescales every point in that frame. This
# removes DA3-g's per-frame scale drift — the near-field defect diagnosed in sec:da3lg
# that the per-track refiner structurally cannot see. The head is zero-init, so v43
# starts exactly at v42; warm-start from the v42 checkpoint via --init-ckpt.

model:
  dim: 128
  state_dim: 64
  num_heads: 4
  num_layers: 2
  max_log_correction: 2.0
  max_delta_uv: 2.0
  patch_size: 5
  per_frame_scale: true        # v43: within-frame per-frame global-scale head
  max_scale_correction: 0.5    # per-frame log-scale bounded to ±0.5 (≈ ±65%)
  d_proj: 64
  dino_model: facebook/dinov3-vits16-pretrain-lvd1689m
  dino_image_size: 448
  image_size: 896

flow:
  url: MemorySlices/Tartan-C-T-TSKH-spring540x960-M
  cfg: third_party/SEA-RAFT/config/eval/spring-M.json
  iters: 4
  scale: null
  fb_alpha: 0.05
  fb_beta: 1.0

data:
  subsets: [pstudio, drivetrack, adt]
  image_size: 896
  num_tracks: 256
  da3_depth_root: ~/data/tapvid3d_da3nested
  oversample: {pstudio: 20}
  split:
    source: official
    n_val_monitor: 15
    seed: 42

train:
  steps: 20000
  warmup: 500
  decay: 2000
  ckpt_every: 500
  val_every: 500
  log_every: 50
  lr: 3.0e-4
  weight_decay: 0.05
  grad_clip: 1.0
  batch: 1
  window: 8
  amp: bf16
  num_workers: 0
  seed: 0

loss:
  weights:
    pos_3D: 1.0
    reg_uv: 0.1
