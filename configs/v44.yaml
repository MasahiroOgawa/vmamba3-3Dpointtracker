version: v44

# v44 — DA3-g per-frame scale de-flicker (standalone; no v35 refiner).
#
# WAFT flow + DA3-g depth + a time-axis Mamba-3 that removes DA3-g's per-frame
# scale drift (sec:da3lg): each frame's visible points are mean-pooled into one
# token, a bidirectional Mamba-3 mixes those tokens over time, and a zero-init head
# emits one log-scale per frame applied to depth along the frozen ray. Comparable
# head-to-head with the WAFT+DA3-g (v40) baseline. Trained from scratch (zero-init
# scale head starts exactly at v40). Loss is 3D-only (2D track frozen).

model:
  dim: 128
  state_dim: 64
  num_heads: 4
  num_layers: 2
  max_scale_correction: 0.5    # per-frame log-scale bounded to ±0.5 (≈ ±65%)

flow:
  url: MemorySlices/Tartan-C-T-TSKH-spring540x960-M
  cfg: third_party/SEA-RAFT/config/eval/spring-M.json
  iters: 4
  scale: null
  fb_alpha: 0.05
  fb_beta: 1.0

data:
  subsets: [pstudio, drivetrack, adt]
  image_size: 896
  num_tracks: 256
  da3_depth_root: ~/data/tapvid3d_da3nested
  oversample: {pstudio: 20}
  split:
    source: official
    n_val_monitor: 15
    seed: 42

train:
  steps: 20000
  warmup: 500
  decay: 2000
  ckpt_every: 500
  val_every: 500
  log_every: 50
  lr: 3.0e-4
  weight_decay: 0.05
  grad_clip: 1.0
  batch: 1
  window: 8
  amp: bf16
  num_workers: 0
  seed: 0

loss:
  weights:
    pos_3D: 1.0
