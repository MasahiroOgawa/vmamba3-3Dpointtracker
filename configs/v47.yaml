version: v47

# v47 — shared ego-motion pose head on top of v45. A per-frame masked-mean pool over
# points (O(N), so no v46-style OOM) feeds (a) a shared-context depth correction
# broadcast back to every point and (b) a per-frame 6-DoF camera pose. A
# self-supervised static-world-consistency loss trains the pose to explain the shared
# ego-motion (sec:v47). All new heads zero-init (ctx→0, pose→identity), so v47 starts
# exactly at v45; warm-started from the v45 checkpoint via --init-ckpt (strict=False).

model:
  dim: 128
  state_dim: 64
  num_heads: 4
  num_layers: 2
  max_log_correction: 2.0
  max_delta_uv: 2.0
  patch_size: 5
  max_scale_correction: 0.5
  d_proj: 64
  dino_model: facebook/dinov3-vits16-pretrain-lvd1689m
  dino_image_size: 448
  image_size: 896

flow:
  url: MemorySlices/Tartan-C-T-TSKH-spring540x960-M
  cfg: third_party/SEA-RAFT/config/eval/spring-M.json
  iters: 4
  scale: null
  fb_alpha: 0.05
  fb_beta: 1.0

data:
  subsets: [pstudio, drivetrack, adt]
  image_size: 896
  num_tracks: 256
  da3_depth_root: ~/data/tapvid3d_da3nested
  oversample: {pstudio: 20}
  split:
    source: official
    n_val_monitor: 15
    seed: 42

train:
  steps: 20000
  warmup: 500
  decay: 2000
  ckpt_every: 500
  val_every: 500
  log_every: 50
  lr: 3.0e-4
  weight_decay: 0.05
  grad_clip: 1.0
  batch: 1
  window: 8
  amp: bf16
  num_workers: 0
  seed: 0

loss:
  weights:
    pos_3D: 1.0
    reg_uv: 0.1
    world_consistency: 0.05
