version: v35

# v48 — "true Vision-Mamba-3" refiner on DA3-l depth.
#
# Same architecture, loss, and DA3-l depth source as v35 (version stays "v35" so
# the trainer builds Mamba3V35Refiner). The ONLY change vs v35 is the appearance
# feature encoder: instead of the frozen off-the-shelf DINOv3 backbone, features
# are computed by a trainable Vision-Mamba-3 (NC-SSD) encoder from scratch
# (model.feat_encoder: vmamba3). This lets the evaluation report the standalone
# ability of genuine Vision-Mamba-3 features rather than borrowing DINOv3.
#
# The depth path (WAFT/SEA-RAFT flow + DA3-l metric depth + refiner) is kept.
# Warm-start the refiner (SSM + heads) from the v35 checkpoint via --init-ckpt;
# the VMamba3 encoder is not in that checkpoint, so it starts from random init.
# Evaluate with the WAFT front-end (the v48 analog of v39), --method v35.

model:
  dim: 128
  state_dim: 64
  num_heads: 4
  num_layers: 2
  max_log_correction: 2.0
  max_delta_uv: 2.0
  patch_size: 5
  d_proj: 64
  image_size: 896
  # --- true Vision-Mamba-3 feature encoder (replaces frozen DINOv3) ---
  feat_encoder: vmamba3
  vmamba3_dim: 384       # feature dim (matches DINOv3-S so feat_proj/warm-start align)
  vmamba3_heads: 6
  vmamba3_blocks: 2
  vmamba3_patch: 14      # 32-grid x 14 = 448 px encoder input (as DINOv3)
  vmamba3_grid: 32

flow:
  url: MemorySlices/Tartan-C-T-TSKH-spring540x960-M
  cfg: third_party/SEA-RAFT/config/eval/spring-M.json
  iters: 4
  scale: null
  fb_alpha: 0.05
  fb_beta: 1.0

data:
  subsets: [pstudio, drivetrack, adt]
  image_size: 896
  num_tracks: 256
  da3_depth_root: ~/data/tapvid3d_da3        # DA3-l
  split:
    source: official
    n_val_monitor: 15
    seed: 42

train:
  steps: 20000
  warmup: 500
  decay: 2000
  ckpt_every: 500
  val_every: 500
  log_every: 50
  lr: 3.0e-4
  weight_decay: 0.05
  grad_clip: 1.0
  batch: 1
  window: 8
  amp: bf16
  num_workers: 0
  seed: 0

loss:
  weights:
    pos_3D: 1.0
    reg_uv: 0.1
