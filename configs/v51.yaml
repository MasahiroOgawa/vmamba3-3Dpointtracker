# v51 — v45 with the refiner's mixer swapped to VSSD-beta,gamma (two-pool).
#
# One variable against v45 (DA3-g + de-flicker, 0.232): Mamba3CrossAttention gains a second, independently-read
# pool -- its own query projection C^(2) and its own per-token vector m^(2) -- which is the
# construction of the paper's VSSD-beta,gamma. Variant B's mask is rank-1 across the query axis,
# so one pool applies the same weighting over the sequence to every query; two pools read by
# different query projections lift that restriction.
#
# pool2_gate starts at zero, so this model is numerically identical to the v45 checkpoint it
# warm-starts from and can only move away from it by training.
#
# NOT applied: 2-D RoPE. Its angle is theta_row*r + theta_col*c, a function of a patch's row and
# column on an image grid. This mixer runs over a track's TIME axis, which has neither, so 2-D
# RoPE has nothing to encode here. The 1-D analogue (a temporal rotary) is a separate change and
# is deliberately not bundled into this comparison.
version: v45

# v45 — two-stage 'de-flicker then refine': v44 de-flicker (stage 1) feeds a
# stabilised depth into the standard v35 refiner (stage 2). Removes DA3-g's
# per-frame scale drift *before* the refiner, so the along-ray Δlog z and Δu act on
# temporally consistent depth. Warm-started from a combined checkpoint (v44 deflicker
# + v42 v35 refiner) via --init-ckpt; both stages zero-init so it starts at v40.

model:
  two_pool: true            # VSSD-beta,gamma second pool
  dim: 128
  state_dim: 64
  num_heads: 4
  num_layers: 2
  max_log_correction: 2.0
  max_delta_uv: 2.0
  patch_size: 5
  max_scale_correction: 0.5
  d_proj: 64
  dino_model: facebook/dinov3-vits16-pretrain-lvd1689m
  dino_image_size: 448
  image_size: 896

flow:
  url: MemorySlices/Tartan-C-T-TSKH-spring540x960-M
  cfg: third_party/SEA-RAFT/config/eval/spring-M.json
  iters: 4
  scale: null
  fb_alpha: 0.05
  fb_beta: 1.0

data:
  subsets: [pstudio, drivetrack, adt]
  image_size: 896
  num_tracks: 256
  da3_depth_root: ~/data/tapvid3d_da3nested
  oversample: {pstudio: 20}
  split:
    source: official
    n_val_monitor: 15
    seed: 42

train:
  steps: 20000
  warmup: 500
  decay: 2000
  ckpt_every: 500
  val_every: 500
  log_every: 50
  lr: 3.0e-4
  weight_decay: 0.05
  grad_clip: 1.0
  batch: 1
  window: 8
  amp: bf16
  num_workers: 0
  seed: 0

loss:
  weights:
    pos_3D: 1.0
    reg_uv: 0.1
