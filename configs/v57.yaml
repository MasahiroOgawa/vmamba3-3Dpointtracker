# v53 — DA3-l, VSSD-gamma (one pool), TRAINED on WAFT flow.
#
# Base v35. The four v53-56 configs form a 2x2: depth backbone x mixer, with the
# front-end held fixed at WAFT for BOTH training and evaluation. Every previously reported
# WAFT row was trained on SEA-RAFT and only evaluated on WAFT, so the refiner had learned a
# different front-end's error characteristics than the one it was scored with.
#
# Requires WAFT tracks for the full_eval training clips; see scripts/eval_waft.py
# --split full_eval. Pass --waft-pred-dir at BOTH train and eval time.
version: v35

# v35 — Image-conditioned VMamba3 tracker with joint 2D+depth correction.
#
# Extends v33 by adding frozen DINOv3 appearance features and a local depth patch
# as per-track context. The SSM now emits both Δlog_z (depth refinement) and
# bounded Δuv (2D correction). Depth is re-sampled at the corrected uv before
# unprojection, so gradients flow into uv via F.grid_sample.
#
# Zero-init on dz_head and duv_head → starts at SEA-RAFT+DA3 baseline.
# Loss: vis-masked L1 3D + λ_uv * vis * |Δuv|² regularization.

model:
  two_pool: false
  dim: 128
  state_dim: 64
  num_heads: 4
  num_layers: 2
  max_log_correction: 2.0    # depth: [e^-2, e^2] ≈ [0.13x, 7.4x]
  max_delta_uv: 2.0          # 2D correction bounded to ±2 px
  patch_size: 5              # 5×5 depth patch
  d_proj: 64                 # DINOv3 384-dim projected to 64
  dino_model: facebook/dinov3-vits16-pretrain-lvd1689m
  dino_image_size: 448
  image_size: 896

flow:
  # What this arm actually trained on: a full_eval track precomputed once from CLEAN images.
  # Recorded here so cfg.json describes the run. A cached track is NOT the same protocol as
  # the live SEA-RAFT path, which re-tracks on the augmented images every step; see the doc's
  # sec:waft-aug-asymmetry.
  source: waft_cached
  waft_pred_dir: ~/data/tapvid3d_baseline_preds/waft_full_eval
  url: MemorySlices/Tartan-C-T-TSKH-spring540x960-M
  cfg: third_party/SEA-RAFT/config/eval/spring-M.json
  iters: 4
  scale: null
  fb_alpha: 0.05
  fb_beta: 1.0

data:
  subsets: [pstudio, drivetrack, adt]
  image_size: 896
  num_tracks: 256
  da3_depth_root: ~/data/tapvid3d_da3
  split:
    source: official
    n_val_monitor: 15
    seed: 42

train:
  steps: 20000
  warmup: 500
  decay: 2000
  ckpt_every: 500
  val_every: 500
  log_every: 50
  lr: 3.0e-4
  weight_decay: 0.05
  grad_clip: 1.0
  batch: 1
  window: 8
  amp: bf16
  num_workers: 0
  seed: 0

loss:
  weights:
    pos_3D: 1.0
    reg_uv: 0.1    # λ_uv: calibrate so mean|Δuv| ≈ 1px at convergence
