# v62 = v60 (WAFT-trained, DA3-g, VSSD-2pool) with the DE-FLICKER STAGE REMOVED.
# version: v35 is the refiner-only architecture; v45 is refiner + de-flicker. Everything else
# is held at v60's values, including the DA3-g depth cache and the pstudio oversampling, so
# v62 vs v60 isolates the de-flicker stage and nothing else.
#
# Motivation: WAFT training helped the DA3-l pipeline (v39 0.2459 -> v57 0.2504) and hurt the
# DA3-g one (v45 0.2320 -> v59 0.2194). The only structural difference between them is the
# de-flicker stage, and in the WAFT-trained model that stage predicts a per-frame log-scale of
# 0.0006 against v45's 0.0191 -- it has gone silent. This arm asks whether removing it recovers
# the DA3-g result.
# v56 — DA3-g + de-flicker, VSSD-beta,gamma (two pool), TRAINED on WAFT flow.
#
# Base v45. The four v53-56 configs form a 2x2: depth backbone x mixer, with the
# front-end held fixed at WAFT for BOTH training and evaluation. Every previously reported
# WAFT row was trained on SEA-RAFT and only evaluated on WAFT, so the refiner had learned a
# different front-end's error characteristics than the one it was scored with.
#
# Requires WAFT tracks for the full_eval training clips; see scripts/eval_waft.py
# --split full_eval. Pass --waft-pred-dir at BOTH train and eval time.
version: v35

# v45 — two-stage 'de-flicker then refine': v44 de-flicker (stage 1) feeds a
# stabilised depth into the standard v35 refiner (stage 2). Removes DA3-g's
# per-frame scale drift *before* the refiner, so the along-ray Δlog z and Δu act on
# temporally consistent depth. Warm-started from a combined checkpoint (v44 deflicker
# + v42 v35 refiner) via --init-ckpt; both stages zero-init so it starts at v40.

model:
  two_pool: true
  dim: 128
  state_dim: 64
  num_heads: 4
  num_layers: 2
  max_log_correction: 2.0
  max_delta_uv: 2.0
  patch_size: 5
  max_scale_correction: 0.5
  d_proj: 64
  dino_model: facebook/dinov3-vits16-pretrain-lvd1689m
  dino_image_size: 448
  image_size: 896

flow:
  # What this arm actually trained on: a full_eval track precomputed once from CLEAN images.
  # Recorded here so cfg.json describes the run. A cached track is NOT the same protocol as
  # the live SEA-RAFT path, which re-tracks on the augmented images every step; see the doc's
  # sec:waft-aug-asymmetry.
  source: waft_cached
  waft_pred_dir: ~/data/tapvid3d_baseline_preds/waft_full_eval
  url: MemorySlices/Tartan-C-T-TSKH-spring540x960-M
  cfg: third_party/SEA-RAFT/config/eval/spring-M.json
  iters: 4
  scale: null
  fb_alpha: 0.05
  fb_beta: 1.0

data:
  subsets: [pstudio, drivetrack, adt]
  image_size: 896
  num_tracks: 256
  da3_depth_root: ~/data/tapvid3d_da3nested
  oversample: {pstudio: 20}
  split:
    source: official
    n_val_monitor: 15
    seed: 42

train:
  steps: 20000
  warmup: 500
  decay: 2000
  ckpt_every: 500
  val_every: 500
  log_every: 50
  lr: 3.0e-4
  weight_decay: 0.05
  grad_clip: 1.0
  batch: 1
  window: 8
  amp: bf16
  num_workers: 0
  seed: 0

loss:
  weights:
    pos_3D: 1.0
    reg_uv: 0.1
