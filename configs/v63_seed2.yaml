# v63 with a different seed and nothing else changed.
#
# The gap to DELTA is -0.0032 and every number in this project is a single run, so it is unknown
# whether that gap exceeds run-to-run variation. One repeat does not estimate the variance, but it
# bounds whether a difference of 0.003 is readable at all.
version: v45
model:
  two_pool: true
  dim: 128
  state_dim: 64
  num_heads: 4
  num_layers: 2
  max_log_correction: 2.0
  max_delta_uv: 2.0
  patch_size: 5
  max_scale_correction: 0.5
  d_proj: 64
  dino_model: facebook/dinov3-vits16-pretrain-lvd1689m
  dino_image_size: 448
  image_size: 896
flow:
  source: waft_live
  url: MemorySlices/Tartan-C-T-TSKH-spring540x960-M
  cfg: third_party/SEA-RAFT/config/eval/spring-M.json
  iters: 4
  scale: -1
  fb_alpha: 0.05
  fb_beta: 1.0
data:
  # Pinned to the pre-2026-09-10 sampler, which kept only the queries anchored inside the
  # window (~8 tracks per item). This run's published number was produced that way.
  reanchor_window: false
  subsets:
  - pstudio
  - drivetrack
  - adt
  image_size: 896
  num_tracks: 256
  da3_depth_root: ~/data/tapvid3d_da3nested
  oversample:
    pstudio: 20
  split:
    source: official
    n_val_monitor: 15
    seed: 42
train:
  out_dir: result/v63_seed2
  steps: 20000
  warmup: 500
  decay: 2000
  ckpt_every: 500
  val_every: 500
  log_every: 50
  lr: 0.0003
  weight_decay: 0.05
  grad_clip: 1.0
  batch: 1
  window: 8
  amp: bf16
  num_workers: 0
  seed: 1000
loss:
  weights:
    pos_3D: 1.0
    reg_uv: 0.1
