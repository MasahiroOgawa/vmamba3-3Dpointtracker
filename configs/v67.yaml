# v67: WAFT run LIVE at half resolution (scale -1) for BOTH training and evaluation.
# Derived from configs/v64.yaml; the only changes are the flow front-end, its scale and iteration
# count, and the output directory.
#
# Replaces a paper row whose model was trained on SEA-RAFT tracks and evaluated on WAFT
# tracks. Half resolution is SEA-RAFT's own operating point and is where every other row in
# the table already sits, so this makes the table internally consistent; full resolution
# costs 8.7x for at most +0.0013 and was dropped.
version: v35
model:
  two_pool: false
  dim: 128
  state_dim: 64
  num_heads: 4
  num_layers: 2
  max_log_correction: 2.0
  max_delta_uv: 2.0
  patch_size: 5
  d_proj: 64
  dino_model: facebook/dinov3-vits16-pretrain-lvd1689m
  dino_image_size: 448
  image_size: 896
flow:
  source: waft_live
  scale: -1
  url: MemorySlices/Tartan-C-T-TSKH-spring540x960-M
  cfg: third_party/SEA-RAFT/config/eval/spring-M.json
  iters: 4
  fb_alpha: 0.05
  fb_beta: 1.0
data:
  subsets:
  - pstudio
  - drivetrack
  - adt
  image_size: 896
  num_tracks: 256
  da3_depth_root: ~/data/tapvid3d_da3
  split:
    source: official
    n_val_monitor: 15
    seed: 42
train:
  out_dir: result/v67_waft448_da3l_1pool
  steps: 20000
  warmup: 500
  decay: 2000
  ckpt_every: 500
  val_every: 500
  log_every: 50
  lr: 0.0003
  weight_decay: 0.05
  grad_clip: 1.0
  batch: 1
  window: 8
  amp: bf16
  num_workers: 0
  seed: 0
loss:
  weights:
    pos_3D: 1.0
    reg_uv: 0.1
