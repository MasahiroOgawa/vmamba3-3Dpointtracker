# v72: WAFT + DA3-g + Mamba-3 depth-scale refiner. Standalone, to establish the stage's own
# ability before it is composed with the appearance refiner in v73.
#
# Three changes from the first attempt, each from a measurement:
#   linear_init  -- a least-squares map from log-depth quantiles to the per-frame scale, fitted on
#                   minival-DISJOINT training clips. Held out, that map alone is worth +0.0734 of
#                   metric-AJ (0.2484 -> 0.3217), which is more than the first version learned from
#                   scratch. The module now starts there and learns a residual.
#   quantiles    -- supplied directly to the token. The encoder ends in a global average, so it saw
#                   essentially the MEAN of log-depth, which predicts the target at R^2 0.37 against
#                   0.51 for the quantile vector. Averaging discarded the useful half.
#   early stop   -- val_every 2000 with patience 3 on the BEST value and a 0.01 tolerance, not a
#                   flatness test between neighbours: at the old val_clips=5 the median change
#                   between consecutive checks was 0.103 against a whole-run spread of 0.096, so two
#                   numbers carried no information. val_clips is now 25, cutting that noise ~2.2x.
#
# steps: 20000 is a ceiling, not a target -- early stopping decides the length.
# Compare against v69 0.1998 (the old stage, standalone) and the linear map's own 0.3217.
version: v72
model:
  two_pool: true
  dim: 128
  state_dim: 64
  num_heads: 4
  num_layers: 2
  max_scale_correction: 2.5
  grid: 64
  log_ref: 2.0
  log_std: 1.5
  linear_init: result/scale_linear_init.npz
flow:
  source: waft_live
  url: MemorySlices/Tartan-C-T-TSKH-spring540x960-M
  cfg: third_party/SEA-RAFT/config/eval/spring-M.json
  iters: 4
  scale: -1
  fb_alpha: 0.05
  fb_beta: 1.0
data:
  subsets:
  - pstudio
  - drivetrack
  - adt
  image_size: 896
  num_tracks: 256
  da3_depth_root: ~/data/tapvid3d_da3nested
  oversample:
    pstudio: 20
  split:
    source: official
    n_val_monitor: 15
    seed: 42
train:
  out_dir: result/v72_depth_scale_refiner
  steps: 20000
  warmup: 500
  decay: 2000
  ckpt_every: 500
  val_every: 2000
  log_every: 50
  lr: 0.0003
  weight_decay: 0.05
  grad_clip: 1.0
  batch: 1
  window: 8
  amp: bf16
  num_workers: 0
  seed: 0
  val_clips: 25
  early_stop_patience: 3
  early_stop_min_delta: 0.01
loss:
  weights:
    pos_3D: 1.0
    reg_uv: 0.1
  lambda_dsr: 1.0
