# v73: WAFT + DA3-g + Mamba-3 depth-scale refiner + vmamba3-2pool. The best-DA3-g candidate.
#
# 20000 steps, step-matched to v63 (0.2238) and v45 (0.2320), the arms it must beat.
#
# Stage 1 is warm-started from v72's trained weights via train.init_ckpt, so its total exposure is
# v72's steps plus these 20000 -- more than v63's 20000 joint, not less. init_ckpt is a weights-only
# load with strict=False, which silently matches ZERO keys if the prefixes differ, so the launcher
# verifies the loaded count rather than trusting the log line.
#
# linear_init is kept as a fallback: if the warm start is skipped the bypass still starts at the
# least-squares solution rather than at zero.
version: v73
model:
  two_pool: true
  dim: 128
  state_dim: 64
  num_heads: 4
  num_layers: 2
  max_log_correction: 2.0
  max_delta_uv: 2.0
  patch_size: 5
  max_scale_correction: 2.5
  d_proj: 64
  dino_model: facebook/dinov3-vits16-pretrain-lvd1689m
  dino_image_size: 448
  image_size: 896
  grid: 64
  log_ref: 2.0
  log_std: 1.5
  linear_init: result/scale_linear_init.npz
flow:
  source: waft_live
  url: MemorySlices/Tartan-C-T-TSKH-spring540x960-M
  cfg: third_party/SEA-RAFT/config/eval/spring-M.json
  iters: 4
  scale: -1
  fb_alpha: 0.05
  fb_beta: 1.0
data:
  # Pinned to the pre-2026-09-10 sampler, which kept only the queries anchored inside the
  # window (~8 tracks per item). This run's published number was produced that way.
  reanchor_window: false
  subsets:
  - pstudio
  - drivetrack
  - adt
  image_size: 896
  num_tracks: 256
  da3_depth_root: ~/data/tapvid3d_da3nested
  oversample:
    pstudio: 20
  split:
    source: official
    n_val_monitor: 15
    seed: 42
train:
  out_dir: result/v73_dsr_plus_vmamba3_2pool
  steps: 20000
  warmup: 500
  decay: 2000
  ckpt_every: 500
  val_every: 2000
  log_every: 50
  lr: 0.0003
  weight_decay: 0.05
  grad_clip: 1.0
  batch: 1
  window: 8
  amp: bf16
  num_workers: 0
  seed: 0
  val_clips: 25
  init_ckpt: result/v72_depth_scale_refiner/ckpt_20000.pt
loss:
  weights:
    pos_3D: 1.0
    reg_uv: 0.1
  lambda_dsr: 1.0
