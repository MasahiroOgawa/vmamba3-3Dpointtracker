# v74: v63 with the de-flicker stage replaced by the standalone-trained depth-scale refiner.
#
# Warm-started from v63's checkpoint: its v35 refiner weights carry over key-for-key (both models
# nest it under v35.), so only the first stage is new and 6000 steps is a fine-tune rather than a
# retrain. The de-flicker weights in that checkpoint are simply unused.
#
# The scale stage is the one trained standalone on L_dsr alone -- 66.6% reduction in scale error on
# held-out clips, against the linear fit's ~30%. No linear bypass: that shortcut is what stopped the
# previous version's network from learning at all.
#
# Targets: v63 0.2238, DELTA 0.2270, oracle per-frame scale 0.3298 (all metric-AJ, DA3-g).
version: v73
model:
  two_pool: true
  dim: 128
  state_dim: 64
  num_heads: 4
  num_layers: 2
  max_log_correction: 2.0
  max_delta_uv: 2.0
  patch_size: 5
  max_scale_correction: 2.5
  d_proj: 64
  dino_model: facebook/dinov3-vits16-pretrain-lvd1689m
  dino_image_size: 448
  image_size: 896
  grid: 64
  log_ref: 2.0
  log_std: 1.5
flow:
  source: waft_live
  url: MemorySlices/Tartan-C-T-TSKH-spring540x960-M
  cfg: third_party/SEA-RAFT/config/eval/spring-M.json
  iters: 4
  scale: -1
  fb_alpha: 0.05
  fb_beta: 1.0
data:
  subsets:
  - pstudio
  - drivetrack
  - adt
  image_size: 896
  num_tracks: 256
  da3_depth_root: ~/data/tapvid3d_da3nested
  oversample:
    pstudio: 20
  split:
    source: official
    n_val_monitor: 15
    seed: 42
train:
  out_dir: result/v74_newscale_from_v63
  steps: 6000
  warmup: 500
  decay: 2000
  ckpt_every: 500
  val_every: 1000
  log_every: 50
  lr: 0.0003
  weight_decay: 0.05
  grad_clip: 1.0
  batch: 1
  window: 8
  amp: bf16
  num_workers: 0
  seed: 0
  val_clips: 25
  init_ckpt: result/v63_waft_live_2pool/ckpt_20000.pt
  early_stop_patience: 3
  early_stop_min_delta: 0.005
loss:
  weights:
    pos_3D: 1.0
    reg_uv: 0.1
  lambda_dsr: 1.0
