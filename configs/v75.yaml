# v75: WAFT + (DA3-g + Mamba-3 depth-scale refiner) + vmamba3-2pool.
#
# The scale refiner is the standalone-trained one and is FROZEN: it is a fixed improvement to the
# depth estimator, and the vmamba3 refiner trains on top of depth that is already corrected. That
# arrangement is the point -- (DA3-g + scale refiner) is simply a better depth source.
#
# v74 tested something else by mistake. Its init_ckpt was v63, which contains deflicker.* and no
# scale_refiner.*, so the scale stage started from a default init -- an identity, contributing
# nothing -- and had to learn jointly against a refiner correcting the same error. It scored 0.1792.
# The 0.2385 standalone model was never in it.
#
# The v35 refiner is warm-started from v63 (295 of its 371 tensors match by name and shape), so this
# is a 6000-step fine-tune onto the new depth rather than a retrain.
#
# lambda_dsr is 0: supervising a frozen stage does nothing.
#
# Reference points, metric-AJ on DA3-g:
#   scale refiner alone, raw tracks   0.2385   <- already beats DELTA
#   v63  de-flicker + vmamba3-2pool   0.2238
#   DELTA + DA3-g                     0.2270
#   oracle per-frame scale            0.3298
version: v73
model:
  two_pool: true
  dim: 128
  state_dim: 64
  num_heads: 4
  num_layers: 2
  max_log_correction: 2.0
  max_delta_uv: 2.0
  patch_size: 5
  max_scale_correction: 2.5
  d_proj: 64
  dino_model: facebook/dinov3-vits16-pretrain-lvd1689m
  dino_image_size: 448
  image_size: 896
  grid: 64
  log_ref: 2.0
  log_std: 1.5
  scale_init: result/scale_standalone/best.pt
  freeze_scale: true
flow:
  source: waft_live
  url: MemorySlices/Tartan-C-T-TSKH-spring540x960-M
  cfg: third_party/SEA-RAFT/config/eval/spring-M.json
  iters: 4
  scale: -1
  fb_alpha: 0.05
  fb_beta: 1.0
data:
  subsets:
  - pstudio
  - drivetrack
  - adt
  image_size: 896
  num_tracks: 256
  da3_depth_root: ~/data/tapvid3d_da3nested
  oversample:
    pstudio: 20
  split:
    source: official
    n_val_monitor: 15
    seed: 42
train:
  out_dir: result/v75_frozenscale_from_v63
  steps: 6000
  warmup: 500
  decay: 2000
  ckpt_every: 500
  val_every: 1000
  log_every: 50
  lr: 0.0003
  weight_decay: 0.05
  grad_clip: 1.0
  batch: 1
  window: 8
  amp: bf16
  num_workers: 0
  seed: 0
  val_clips: 25
  init_ckpt: result/v63_waft_live_2pool/ckpt_20000.pt
  early_stop_patience: 3
  early_stop_min_delta: 0.005
loss:
  weights:
    pos_3D: 1.0
    reg_uv: 0.1
  lambda_dsr: 0.0
