# holdout_val pinned False: v81 (the other rung of this ladder) started before the monitor-clip
# holdout fix landed, and the ladder must differ in lr alone. Runs after this one use the
# corrected default and their VAL numbers are NOT comparable to v73-v82.
version: v73
model:
  two_pool: true
  dim: 128
  state_dim: 64
  num_heads: 4
  num_layers: 2
  max_log_correction: 2.0
  max_delta_uv: 2.0
  patch_size: 5
  max_scale_correction: 2.5
  d_proj: 64
  dino_model: facebook/dinov3-vits16-pretrain-lvd1689m
  dino_image_size: 448
  image_size: 896
  grid: 64
  log_ref: 2.0
  log_std: 1.5
  scale_init: result/scale_standalone/best.pt
  freeze_scale: true
flow:
  source: waft_live
  url: MemorySlices/Tartan-C-T-TSKH-spring540x960-M
  cfg: third_party/SEA-RAFT/config/eval/spring-M.json
  iters: 4
  scale: -1
  fb_alpha: 0.05
  fb_beta: 1.0
data:
  subsets:
  - pstudio
  - drivetrack
  - adt
  image_size: 896
  num_tracks: 256
  da3_depth_root: ~/data/tapvid3d_da3nested
  split:
    source: official
    n_val_monitor: 15
    seed: 42
    holdout_val: false
train:
  out_dir: result/v82_lr3e-06
  steps: 1500
  warmup: 100
  decay: 1400
  ckpt_every: 500
  val_every: 250
  log_every: 50
  lr: 3.0e-06
  weight_decay: 0.05
  grad_clip: 1.0
  batch: 1
  window: 8
  amp: bf16
  num_workers: 0
  seed: 0
  val_clips: 25
  early_stop_patience: 2
  early_stop_min_delta: 0.005
loss:
  weights:
    pos_3D: 1.0
    reg_uv: 0.1
    metre_space: false
    metre_scale: 1.0
  lambda_dsr: 0.0
