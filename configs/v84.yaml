# v84: the composite at v63's training budget. This is the run the evidence points to.
#
# What was wrong with every arm before this. The bar "untrained composite = 0.2385" was an INFERENCE,
# never a measurement, and it is false. 0.2385 came from apply_learned_scale.py, which does
#     tracks_XYZ = pr * exp(ds)
# i.e. it rescales the WAFT baseline's OWN 3-D tracks per frame. No v35 refiner, no DINOv3, no
# ray*z reconstruction. Mamba3V73 instead builds points from ray * z_raw * scale, where z_raw is the
# DA3-g map sampled at the tracked pixel -- a different quantity. So the composite's zero-init state
# was never that pipeline, and eight arms were scored against a bar that did not apply to them.
#
# With that removed, the arms order monotonically in TRAINING BUDGET:
#     v82  1000 @ 3e-6  0.0982
#     v81  1500 @ 1e-5  0.1728
#     v78a 1500 @ 3e-5  0.1978
#     v76  4000 @ 3e-4  0.2035
#     v63 20000 @ 3e-4  0.2238
# Undertrained, not overfitted, and not a broken objective. lr=3e-4 was correct all along; the
# lower-lr sweep was chasing an artefact of the wrong bar.
#
# Hence: v63's exact budget (3e-4, 20000 steps, warmup 500, decay 2000), no early stopping, on the
# V73 composite. pstudio oversampling matches v63 -- removing it was only ever tested at a lower lr
# (v81), so its effect is unknown and this run should not confound it.
#
# Validation is now a real signal for the first time in this line: monitor clips are HELD OUT
# (40 of them) and the dataset RNG is re-seeded each pass, so the curve reflects the model rather
# than which temporal windows were drawn. It is for MONITORING only -- nothing stops on it.
#
# Targets: DELTA 0.2270, the rescaling baseline 0.2385, and v63's 0.2238 on the same budget.
# Cost: ~20-24 h training at the observed 13.5 steps/min, plus ~15 min to score.
version: v73
model:
  two_pool: true
  dim: 128
  state_dim: 64
  num_heads: 4
  num_layers: 2
  max_log_correction: 2.0
  max_delta_uv: 2.0
  patch_size: 5
  max_scale_correction: 2.5
  d_proj: 64
  dino_model: facebook/dinov3-vits16-pretrain-lvd1689m
  dino_image_size: 448
  image_size: 896
  grid: 64
  log_ref: 2.0
  log_std: 1.5
  scale_init: result/scale_standalone/best.pt
  freeze_scale: true
flow:
  source: waft_live
  url: MemorySlices/Tartan-C-T-TSKH-spring540x960-M
  cfg: third_party/SEA-RAFT/config/eval/spring-M.json
  iters: 4
  scale: -1
  fb_alpha: 0.05
  fb_beta: 1.0
data:
  subsets:
  - pstudio
  - drivetrack
  - adt
  image_size: 896
  num_tracks: 256
  da3_depth_root: ~/data/tapvid3d_da3nested
  oversample:
    pstudio: 20
  split:
    source: official
    n_val_monitor: 40
    seed: 42
    holdout_val: true
train:
  out_dir: result/v84_composite_full
  steps: 20000
  warmup: 500
  decay: 2000
  ckpt_every: 2000
  val_every: 1000
  log_every: 50
  lr: 0.0003
  weight_decay: 0.05
  grad_clip: 1.0
  batch: 1
  window: 8
  amp: bf16
  num_workers: 0
  seed: 0
  val_clips: 40
  early_stop_patience: 0
  early_stop_min_delta: 0.005
  val_at_step0: true
loss:
  weights:
    pos_3D: 1.0
    reg_uv: 0.1
    metre_space: false
    metre_scale: 1.0
  lambda_dsr: 0.0
