# v92: train the visibility head, and nothing else.
#
# WHY. On adt our 3D positions are already better than DELTA's -- points within threshold 0.4831
# vs 0.4688, median error 0.204 vs 0.241 m -- and we still lose metric-AJ 0.3062 to 0.3244,
# entirely on occlusion accuracy (0.785 vs 0.826). The evaluated visibility has never been
# predicted: eval_metric3d returned the flow's forward-backward mask unchanged, and the refiner's
# vis_logits were zeros nothing consumed. Scoring the same positions against ground-truth
# visibility gives 0.4194 on adt, so the channel is worth +0.1146 and the gap to DELTA is 0.0196.
#
# WHAT IS TRAINED. Only v35.vis_head, 4 tensors. scale_refiner and v35 are frozen, so every depth
# and uv prediction is bit-identical to the starting point and any change in the metric belongs to
# visibility alone. The head predicts a residual on the flow mask's logit and is zero-initialised,
# so at step 0 it reproduces that mask exactly.
#
# lambda_vis sits outside loss.weights deliberately: those are renormalised to sum to 1, so adding
# a term there would change pos_3D's share. It follows lambda_dsr.
#
# Same start and rate as v91, 400 steps -- which also recreates the checkpoint v91/ckpt_400.pt,
# our best DA3-g result at 0.2251, that the trainer's rotation deleted.
#
# Read: metric-AJ on adt with --vis-source model, against 0.3062 (flow mask) and the 0.4194 ceiling.
data:
  da3_depth_root: ~/data/tapvid3d_da3nested
  image_size: 896
  num_tracks: 256
  oversample:
    pstudio: 20
  split:
    holdout_val: true
    n_val_monitor: 40
    seed: 42
    source: official
  subsets:
  - pstudio
  - drivetrack
  - adt
flow:
  cfg: third_party/SEA-RAFT/config/eval/spring-M.json
  fb_alpha: 0.05
  fb_beta: 1.0
  iters: 4
  scale: -1
  source: waft_live
  url: MemorySlices/Tartan-C-T-TSKH-spring540x960-M
loss:
  lambda_dsr: 0.0
  weights:
    pos_3D: 1.0
    reg_uv: 0.1
  lambda_vis: 1.0
model:
  d_proj: 64
  dim: 128
  dino_image_size: 448
  dino_model: facebook/dinov3-vits16-pretrain-lvd1689m
  grid: 64
  image_size: 896
  log_ref: 2.0
  log_std: 1.5
  max_delta_uv: 2.0
  max_log_correction: 2.0
  max_scale_correction: 2.5
  num_heads: 4
  num_layers: 2
  patch_size: 5
  state_dim: 64
  two_pool: true
  freeze_modules:
  - scale_refiner
  - v35
  train_only:
  - vis_head
train:
  amp: bf16
  batch: 1
  ckpt_every: 100
  decay: 80
  early_stop_min_delta: 0.001
  early_stop_patience: 1000000
  grad_clip: 1.0
  init_ckpt: result/v73fix_warmstart/ckpt_0.pt
  log_every: 25
  lr: 5.0e-05
  num_workers: 0
  out_dir: result/v92
  seed: 0
  steps: 400
  val_at_step0: true
  val_clips: 40
  val_every: 100
  warmup: 0
  weight_decay: 0.05
  window: 8
version: v73
