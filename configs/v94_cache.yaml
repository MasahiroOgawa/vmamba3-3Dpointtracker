# Flow cache for the v94 visibility head: forward and backward flow sampled at each
# tracked point. These two vectors are the head's ONLY input, so nothing else is stored.
#
# The flow settings must match v93's exactly, or the head would be trained on flow the
# refiner never sees. minival clips are additionally checked against the cached WAFT
# predictions v93b was scored with: the run aborts if the recomputed mask disagrees.
cache:
  out_dir: ~/data/tapvid3d_flowvis
  verify_against: ~/data/tapvid3d_baseline_preds/waft_minival_is896_s-1_i4
  subsets: [adt, drivetrack, pstudio]
  n_train_per_subset: 12
  n_heldout_per_subset: 5
  # minival is cached only once the held-out gate passes: it is 167 min of WAFT and is
  # needed only for the final score, so a head that loses to the mask must not pay for it.
  # gate 1 passed on the mean (+0.0072 causal), so minival is now needed for the score
  n_minival_per_subset: null
  seed: 42
data:
  root: ~/data/tapvid3d
  image_size: 896
flow:
  source: waft_live
  iters: 4
  scale: -1
  fb_alpha: 0.05
  fb_beta: 1.0
