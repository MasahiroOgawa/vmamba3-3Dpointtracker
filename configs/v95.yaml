# v95: the v94 visibility head retrained from scratch on the whole training pool
# (configs/v95_cache.yaml), where v94 saw 12 clips per subset.
#
# Same architecture as v94, deliberately: the point of the run is to isolate the effect of
# data, so nothing else may move. Only the schedule is scaled, because v94's limit was not
# steps -- its held-out accuracy peaked at step 1250 of 3000 and then oscillated between
# 0.765 and 0.790 while training loss kept falling from 0.68 to 0.41.
model:
  dim: 64
  state_dim: 64
  num_heads: 4
  num_layers: 2
  bidirectional: true
data:
  cache_dir: ~/data/tapvid3d_flowvis
  subsets: [adt, drivetrack, pstudio]
  num_points: 256
  max_frames: 300
  # Clips resident in RAM. The full pool decompresses to ~12 GB against 13 GB free, so
  # the trainer streams it: a step touches one clip, and this caps the LRU that holds it.
  clip_cache: 512
train:
  out_dir: result/v95
  # 10x v94's 3000. Justified only by the ~118x larger clip pool; if held-out still peaks
  # early and flattens, that is the ceiling of a flow-only head, not a schedule to lengthen.
  steps: 30000
  # 3.0e-4, matching configs/v95_lr3e4.yaml. At 1.0e-3 the held-out curve swung with sd
  # 0.0089 across evaluations against 0.0050 here, for the same best accuracy -- too noisy to
  # select a checkpoint on. Holding lr and schedule identical to that 988-clip arm makes this
  # run a controlled test of one variable: 988 clips against the full 4268.
  lr: 3.0e-4
  warmup: 500
  # Cosine from the end of warmup, not a long plateau at peak lr. With decay: 6000 the
  # schedule held 1.0e-3 for 78% of training and the TRAINING loss stopped falling after
  # ~step 6000 -- flat at 0.33 for 18000 steps, then dropping to 0.30 the moment the decay
  # began. The optimiser was bouncing, not descending, and held-out accuracy swung +-0.03
  # across evaluations as a result.
  decay: 29500
  grad_clip: 1.0
  pos_weight: auto
  log_every: 100
  val_every: 1000
  ckpt_every: 1000
  seed: 42
