# v95: the v94 visibility head retrained from scratch on the whole training pool
# (configs/v95_cache.yaml), where v94 saw 12 clips per subset.
#
# Same architecture as v94, deliberately: the point of the run is to isolate the effect of
# data, so nothing else may move. Only the schedule is scaled, because v94's limit was not
# steps -- its held-out accuracy peaked at step 1250 of 3000 and then oscillated between
# 0.765 and 0.790 while training loss kept falling from 0.68 to 0.41.
model:
  dim: 64
  state_dim: 64
  num_heads: 4
  num_layers: 2
  bidirectional: true
data:
  cache_dir: ~/data/tapvid3d_flowvis
  subsets: [adt, drivetrack, pstudio]
  num_points: 256
  max_frames: 300
  # Clips resident in RAM. The full pool decompresses to ~12 GB against 13 GB free, so
  # the trainer streams it: a step touches one clip, and this caps the LRU that holds it.
  clip_cache: 512
train:
  out_dir: result/v95
  # 10x v94's 3000. Justified only by the ~118x larger clip pool; if held-out still peaks
  # early and flattens, that is the ceiling of a flow-only head, not a schedule to lengthen.
  steps: 30000
  lr: 1.0e-3
  warmup: 500
  decay: 6000
  grad_clip: 1.0
  pos_weight: auto
  log_every: 100
  val_every: 1000
  ckpt_every: 1000
  seed: 42
