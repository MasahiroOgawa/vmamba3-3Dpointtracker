# v95-probe-964: the first probe with the corrected learning-rate schedule.
#
# Identical to configs/v95.yaml, which now decays from the end of warmup. The two earlier
# probes (v95_probe350, v95_probe850) kept the old decay: 6000 and are NOT comparable on
# schedule; they are kept as the record of what exposed the problem. This run has 964 clips
# against probe850's 850, so it is not a controlled schedule-only comparison either -- what
# it settles is whether the training loss falls for the whole run instead of plateauing.
model:
  dim: 64
  state_dim: 64
  num_heads: 4
  num_layers: 2
  bidirectional: true
data:
  cache_dir: ~/data/tapvid3d_flowvis
  subsets: [adt, drivetrack, pstudio]
  num_points: 256
  max_frames: 300
  # Clips resident in RAM. The full pool decompresses to ~12 GB against 13 GB free, so
  # the trainer streams it: a step touches one clip, and this caps the LRU that holds it.
  clip_cache: 512
train:
  out_dir: result/v95_probe964
  # 10x v94's 3000. Justified only by the ~118x larger clip pool; if held-out still peaks
  # early and flattens, that is the ceiling of a flow-only head, not a schedule to lengthen.
  steps: 30000
  lr: 1.0e-3
  warmup: 500
  # Cosine from the end of warmup, not a long plateau at peak lr. With decay: 6000 the
  # schedule held 1.0e-3 for 78% of training and the TRAINING loss stopped falling after
  # ~step 6000 -- flat at 0.33 for 18000 steps, then dropping to 0.30 the moment the decay
  # began. The optimiser was bouncing, not descending, and held-out accuracy swung +-0.03
  # across evaluations as a result.
  decay: 29500
  grad_clip: 1.0
  pos_weight: auto
  log_every: 100
  val_every: 1000
  ckpt_every: 1000
  seed: 42
